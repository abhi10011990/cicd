name: CI-CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/cicd:${{ github.sha }} .

      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/cicd:${{ github.sha }}'
          format: 'table'
          exit-code: '0'

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/cicd:${{ github.sha }}

  deploy:
    needs: build

    # 🔥 IMPORTANT: this is your FIX
    runs-on:
      - self-hosted
      - linux
      - k8s

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify cluster access
        run: |
          kubectl get nodes

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/cicd-app \
            cicd-app=${{ secrets.DOCKER_USERNAME }}/cicd:${{ github.sha }} \
            -n cicd-test

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/cicd-app -n cicd-test